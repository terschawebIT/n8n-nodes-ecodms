# Tag vX.Y.Z → lint, build, npm publish mit Provenance, GitHub Release.
#
# n8n-Vorgabe seit 1. Mai 2026: Community-Nodes für Creator-Portal-Verifizierung
# nur aus GitHub Actions mit npm-Provenance.
# Vorlage: https://github.com/n8n-io/n8n-nodes-starter/blob/master/.github/workflows/publish.yml
# Doku:    https://docs.n8n.io/integrations/community-nodes/building-community-nodes/
#
# Option A (empfohlen für öffentliche Repos) — OIDC Trusted Publishing:
#   Kein npm-Token, kein GitHub-Secret. Auf npmjs.com am Paket:
#   Publish access → Trusted Publishers → GitHub Actions
#     Repository owner: terschawebIT
#     Repository name:  n8n-nodes-ecodms
#     Workflow name:    publish.yml
#     Environment:      (leer)
#     Allowed action:   npm publish
#
# Option B (Fallback, nicht für öffentliche Repos nötig):
#   Granular Access Token als GitHub-Secret NPM_TOKEN. Den Wert niemals
#   in Dateien, Commits oder Workflow-YAML schreiben.
#
# setup-node bewusst OHNE registry-url: ein generiertes .npmrc mit leerem
# _authToken blockiert die OIDC-Anmeldung bei npm.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    name: Build, npm publish, GitHub Release
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            npm: [`n8n-nodes-ecodms`](https://www.npmjs.com/package/n8n-nodes-ecodms)

            See [CHANGELOG.md](https://github.com/terschawebIT/n8n-nodes-ecodms/blob/main/CHANGELOG.md) for details.
