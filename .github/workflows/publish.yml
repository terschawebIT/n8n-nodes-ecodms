# Tag vX.Y.Z (oder workflow_dispatch) → lint, build, npm publish mit Provenance, GitHub Release.
#
# n8n verlangt seit Mai 2026 Community-Nodes mit npm-Provenance aus GitHub Actions.
# Lokal `npm publish` nicht verwenden.
#
# Erstveröffentlichung / bis Trusted Publisher steht: GitHub Secret NPM_TOKEN
# (Granular Access Token, package write). Danach OIDC Trusted Publisher setzen
# und das Secret entfernen.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    name: Build, npm publish, GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            npm: [`n8n-nodes-ecodms`](https://www.npmjs.com/package/n8n-nodes-ecodms)

            See [CHANGELOG.md](https://github.com/terschawebIT/n8n-nodes-ecodms/blob/main/CHANGELOG.md) for details.
